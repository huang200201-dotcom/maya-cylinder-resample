name: Bug 报告
description: 报告安装、模型处理或更新问题
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Maya / 插件版本
      placeholder: Maya 2024 / 插件 0.3.0 / Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 模式、原段数/目标段数、UV/硬边选项与操作顺序
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: 错误信息或截图
      description: 可附公开测试模型；请勿上传私人场景、令牌或其他敏感信息。
