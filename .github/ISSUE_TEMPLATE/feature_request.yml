name: 功能建议
description: 提出明确的建模或维护需求
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 请描述实际建模场景、当前困难与期望结果。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与取舍
      description: 例如是否可以移动旧角点、改变 UV、生成副本或放宽拓扑限制。
