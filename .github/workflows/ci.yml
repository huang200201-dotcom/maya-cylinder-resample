name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pure Python and simulated Maya tests
        run: python -B -m unittest discover -s tests -v
      - name: Build Maya release package
        run: python -B tools/build_release.py --output-dir dist
      - name: Verify package and update manifest
        run: python -B tools/build_release.py --verify-only --output-dir dist
