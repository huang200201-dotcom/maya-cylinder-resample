name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Require matching tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -B tools/build_release.py --check-tag "$RELEASE_TAG" --output-dir dist
      - name: Verify release artifacts
        run: python -B tools/build_release.py --verify-only --output-dir dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/CylinderResample_Maya2024_v*.zip
          dist/update-manifest.json
          dist/CylinderResample_Maya2024_v*.zip.sha256
          --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
